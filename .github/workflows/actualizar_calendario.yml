name: Automatizacion Calendario Economico

on:
  schedule:
    # Se ejecuta automáticamente todos los domingos a las 23:00 UTC (6:00 PM Colombia)
    - cron: '0 23 * * 0'
  workflow_dispatch: # Permite ejecutar manualmente con un botón

jobs:
  ejecutar-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar librerías necesarias
        run: |
          python -m pip install --upgrade pip
          pip install curl-cffi beautifulsoup4 openpyxl pandas

      - name: Ejecutar el script del bot
        run: |
          python bot_calendario.py

      - name: Guardar el Excel actualizado en el repositorio
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add Historico_Eventos_Automatizado.xlsx
          git commit -m "Auto-update: Calendario económico actualizado [skip ci]" || exit 0
          git push